name: Mirror to Epitech

on:
  push:
    branches: [main]

jobs:
  mirror:
    name: Mirror to Epitech repository
    runs-on: ubuntu-latest
    if: github.repository == 'IlonaDolbec/Dashboard'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.mirror_key }}

      - name: Add GitHub to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror
        run: |
          git remote remove epitech 2>/dev/null || true
          git remote add epitech git@github.com:EpitechPGE3-2026/G-WEB-500-NAN-5-1-dashboard-2.git
          git push epitech --mirror